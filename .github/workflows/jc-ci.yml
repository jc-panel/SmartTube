name: Build TubePlus TV

on:
  workflow_dispatch:
  push:
    branches: [ "tubeplus" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (avec sous-modules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Python + Pillow
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pillow

      - name: Personnalisation TubePlus
        run: python3 customize.py

      - name: Clé de signature
        run: |
          echo "storePassword=${{ secrets.KEY_STORE_PASSWORD }}" > keystore.properties
          echo "keyAlias=${{ secrets.ALIAS }}" >> keystore.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> keystore.properties
          echo "storeFile=${{ github.workspace }}/key.jks" >> keystore.properties
          echo "${{ secrets.SIGNING_KEY }}" | base64 --decode > ${{ github.workspace }}/key.jks

      - name: Droits gradlew
        run: chmod +x gradlew

      - name: Build (stbeta release)
        run: ./gradlew clean assembleStbetaRelease

      - name: Renommer l'APK universel
        id: apk
        run: |
          SRC=$(find smarttubetv/build/outputs/apk/stbeta/release -name "*universal*.apk" | head -n1)
          if [ -z "$SRC" ]; then SRC=$(find smarttubetv/build/outputs/apk/stbeta/release -name "*.apk" | head -n1); fi
          cp "$SRC" tubeplus-tv.apk
          echo "path=tubeplus-tv.apk" >> $GITHUB_OUTPUT

      - name: Publier la release « latest »
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: TubePlus TV (dernière version)
          files: tubeplus-tv.apk
          fail_on_unmatched_files: true

      - name: Sauvegarde artifact
        uses: actions/upload-artifact@v4
        with:
          name: tubeplus-tv-apk
          path: tubeplus-tv.apk
          if-no-files-found: error
